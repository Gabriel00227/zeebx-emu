# Compila SÓ o core Linux AArch64 (R36S/ArkOS) e publica o .so como artefato.
# Rode pela aba Actions -> "aarch64" -> Run workflow.
name: aarch64

on:
  workflow_dispatch:

jobs:
  core:
    name: core-linux-aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-exp

      - name: Dependencias do build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 \
            libclang-dev libglib2.0-dev

      - name: Compila o core
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          RUSTFLAGS: "-C target-cpu=cortex-a35"
        run: cargo build --release --locked -p zeebx-libretro

      - name: Confere o ELF
        run: |
          file target/release/libzeebx_libretro.so
          readelf -h target/release/libzeebx_libretro.so | grep -E 'Class:|Machine:'

      - name: Monta o pacote
        run: |
          mkdir -p pacote
          cp target/release/libzeebx_libretro.so pacote/zeebx_libretro.so
          cp frontends/libretro/zeebx_libretro.info pacote/
          md5sum pacote/zeebx_libretro.so
          ls -la pacote/

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx_libretro_linux-aarch64
          path: pacote/
